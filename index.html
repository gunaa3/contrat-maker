<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배차 생성기</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9eb81b2d9508d3c7222269657b22d9a6&libraries=services"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #0f3460;
    --surface: #ffffff;
    --surface2: #f7f8fc;
    --border: #e2e5ef;
    --text: #1a1a2e;
    --muted: #7b8196;
    --success: #2ecc71;
    --shadow: 0 2px 16px rgba(26,26,46,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #eef1f8;
    min-height: 100vh;
    padding: 32px 16px;
    color: var(--text);
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .header-icon {
    width: 44px;
    height: 44px;
    background: var(--primary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.5px;
  }

  .header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* 두 패널 레이아웃 */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 600px) {
    .panels { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .badge-up   { background: #fff3cd; color: #b45309; }
  .badge-down { background: #d1fae5; color: #065f46; }

  .card-header span.label {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
  }

  /* 폼 요소 */
  .field {
    margin-bottom: 12px;
    position: relative;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 5px;
  }

  .field input, .field select {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface2);
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }

  .field input:focus, .field select:focus {
    border-color: var(--accent);
    background: #fff;
  }

  .field input.selected {
    border-color: var(--success);
    background: #f0fdf4;
  }

  /* 검색 결과 드롭다운 */
  .dropdown {
    position: absolute;
    top: calc(100% + 2px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(26,26,46,0.12);
    z-index: 100;
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }

  .dropdown.open { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.15s;
  }

  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: #f5f7ff; }

  .dropdown-item .place-name {
    font-weight: 600;
    color: var(--primary);
  }

  .dropdown-item .place-addr {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* 지도 */
  .map-wrap {
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    display: none;
  }

  .map-wrap.show { display: block; }
  .map-wrap div { border-radius: 10px; }

  /* 장비 + 메모 카드 */
  .extra-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 600px) {
    .extra-card { grid-template-columns: 1fr; }
  }

  /* 결과 카드 */
  .result-card {
    background: var(--primary);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .result-card h3 {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  .result-card textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    font-family: 'Noto Sans KR', monospace;
    color: #e8eaf6;
    line-height: 1.8;
    resize: none;
    outline: none;
    min-height: 240px;
  }

  /* 버튼 */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #d63651; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-copy {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 13px;
  }

  .btn-copy:hover { background: rgba(255,255,255,0.18); }

  .btn-copy.copied {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  /* 연락처 뱃지 */
  .contact-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    padding-left: 2px;
  }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d5e8; border-radius: 4px; }
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="header-icon">🚛</div>
    <div>
      <h1>배차 생성기</h1>
      <p>상하차 정보를 입력하고 배차 메시지를 자동 생성합니다</p>
    </div>
  </div>

  <!-- 상차 / 하차 패널 -->
  <div class="panels">

    <!-- 상차 -->
    <div class="card">
      <div class="card-header">
        <div class="badge badge-up">↑</div>
        <span class="label">상차지</span>
      </div>

      <div class="field" style="position:relative">
        <label>장소 검색</label>
        <input id="pickup" type="text" placeholder="지명, 주소, 거래처명 검색">
        <div id="pickupDropdown" class="dropdown"></div>
      </div>

      <div class="field">
        <label>선택된 주소</label>
        <input id="pickupAddress" type="text" placeholder="검색 후 자동 입력" readonly class="selected" style="color:#065f46; font-size:12px;">
      </div>

      <div class="map-wrap" id="pickupMapWrap">
        <div id="pickupMap" style="width:100%;height:160px;"></div>
      </div>

      <div class="field" style="margin-top:12px">
        <label>상차 일시</label>
        <input id="pickupTime" type="text" placeholder="예) 05/20(월) 09:00">
      </div>

      <div class="field">
        <label>담당자</label>
        <input id="pickupManager" type="text" placeholder="이름 입력" list="managerList">
        <div class="contact-hint" id="pickupContactHint"></div>
      </div>
    </div>

    <!-- 하차 -->
    <div class="card">
      <div class="card-header">
        <div class="badge badge-down">↓</div>
        <span class="label">하차지</span>
      </div>

      <div class="field" style="position:relative">
        <label>장소 검색</label>
        <input id="drop" type="text" placeholder="지명, 주소, 거래처명 검색">
        <div id="dropDropdown" class="dropdown"></div>
      </div>

      <div class="field">
        <label>선택된 주소</label>
        <input id="dropAddress" type="text" placeholder="검색 후 자동 입력" readonly class="selected" style="color:#065f46; font-size:12px;">
      </div>

      <div class="map-wrap" id="dropMapWrap">
        <div id="dropMap" style="width:100%;height:160px;"></div>
      </div>

      <div class="field" style="margin-top:12px">
        <label>하차 일시</label>
        <input id="dropTime" type="text" placeholder="예) 05/20(월) 13:00">
      </div>

      <div class="field">
        <label>담당자</label>
        <input id="dropManager" type="text" placeholder="이름 입력" list="managerList">
        <div class="contact-hint" id="dropContactHint"></div>
      </div>
    </div>

  </div>

  <!-- 장비 + 메모 -->
  <div class="extra-card">
    <div class="field" style="margin-bottom:0">
      <label>장비명</label>
      <input id="equipment" type="text" placeholder="예) Nordlys, PicoWay 등">
    </div>
    <div class="field" style="margin-bottom:0">
      <label>비고 / 메모</label>
      <input id="memo" type="text" placeholder="특이사항 있으면 입력">
    </div>
  </div>

  <!-- 생성 버튼 -->
  <div style="margin-bottom:16px;">
    <button class="btn btn-primary" style="width:100%; padding:14px;" onclick="generate()">
      ✦ 배차 메시지 생성
    </button>
  </div>

  <!-- 결과 -->
  <div class="result-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3>생성된 메시지</h3>
      <button class="btn btn-copy" id="copyBtn" onclick="copyText()">📋 복사</button>
    </div>
    <textarea id="result" readonly placeholder="위에서 정보를 입력 후 생성 버튼을 누르세요."></textarea>
  </div>

</div>

<!-- datalist for manager autocomplete -->
<datalist id="managerList">
  <option value="김기훈">
  <option value="박윤아">
  <option value="김성훈">
  <option value="이가람">
</datalist>

<script>
// ─── 설정 데이터 ───────────────────────────────────────────
const contactMap = {
  "김기훈": "010-3899-1656",
  "박윤아": "010-3020-0568",
  "김성훈": "010-5419-6263",
  "이가람": "010-9294-6541"
};

// 자주 쓰는 거래처 단축 키워드
const locationMap = {
  "용마": { name: "김포 용마창고", address: "경기도 김포시 고촌읍 아라육로 58번길 35-28", lat: 37.608, lng: 126.762 },
  "서초": { name: "서초 사무실",   address: "서울 서초구 강남대로 327 3층",              lat: 37.496, lng: 127.028 }
};

// ─── 카카오 Place 서비스 ───────────────────────────────────
const ps = new kakao.maps.services.Places();

let pickupData = { name: "", address: "", lat: null, lng: null };
let dropData   = { name: "", address: "", lat: null, lng: null };
let pickupMap  = null;
let dropMap    = null;

// ─── 검색 & 드롭다운 ──────────────────────────────────────
function setupSearch(inputId, dropdownId, mapWrapId, mapDivId, store, addressInputId, contactHintId) {
  const input     = document.getElementById(inputId);
  const dropdown  = document.getElementById(dropdownId);
  const addrInput = document.getElementById(addressInputId);
  const hint      = document.getElementById(contactHintId);

  input.addEventListener("input", () => {
    const val = input.value.trim();
    if (!val) { dropdown.classList.remove("open"); return; }

    // 단축 키워드 먼저
    for (const key in locationMap) {
      if (val.includes(key)) {
        const loc = locationMap[key];
        selectLocation(loc.name, loc.address, loc.lat, loc.lng,
          input, addrInput, dropdown, mapWrapId, mapDivId, store);
        return;
      }
    }

    // 카카오 실검색
    ps.keywordSearch(val, (result, status) => {
      if (status !== kakao.maps.services.Status.OK) {
        dropdown.classList.remove("open");
        return;
      }
      renderDropdown(result, dropdown, input, addrInput, mapWrapId, mapDivId, store);
    });
  });

  // 담당자 연락처 자동 힌트
  if (hint) {
    const mgr = document.getElementById(inputId === "pickup" ? "pickupManager" : "dropManager");
    if (mgr) {
      mgr.addEventListener("input", () => {
        const phone = contactMap[mgr.value.trim()];
        hint.textContent = phone ? `📞 ${phone}` : "";
      });
    }
  }

  // 외부 클릭 시 닫기
  document.addEventListener("click", (e) => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove("open");
    }
  });
}

function renderDropdown(places, dropdown, input, addrInput, mapWrapId, mapDivId, store) {
  dropdown.innerHTML = "";
  places.slice(0, 8).forEach(p => {
    const item = document.createElement("div");
    item.className = "dropdown-item";
    item.innerHTML = `<div class="place-name">${p.place_name}</div><div class="place-addr">${p.address_name}</div>`;
    item.addEventListener("click", () => {
      selectLocation(p.place_name, p.address_name, parseFloat(p.y), parseFloat(p.x),
        input, addrInput, dropdown, mapWrapId, mapDivId, store);
    });
    dropdown.appendChild(item);
  });
  dropdown.classList.add("open");
}

function selectLocation(name, address, lat, lng, input, addrInput, dropdown, mapWrapId, mapDivId, store) {
  input.value    = name;
  addrInput.value = address;
  dropdown.classList.remove("open");

  store.name    = name;
  store.address = address;
  store.lat     = lat;
  store.lng     = lng;

  showMap(mapWrapId, mapDivId, lat, lng, name, store);
}

// ─── 지도 표시 ────────────────────────────────────────────
function showMap(wrapId, divId, lat, lng, title, store) {
  const wrap = document.getElementById(wrapId);
  wrap.classList.add("show");

  const container = document.getElementById(divId);
  const coords = new kakao.maps.LatLng(lat, lng);

  if (!store._map) {
    store._map = new kakao.maps.Map(container, { center: coords, level: 4 });
    store._marker = new kakao.maps.Marker({ map: store._map, position: coords, title });
  } else {
    store._map.setCenter(coords);
    store._marker.setPosition(coords);
    store._marker.setTitle(title);
  }
}

// ─── 메시지 생성 ──────────────────────────────────────────
function generate() {
  const pickupTime    = document.getElementById("pickupTime").value.trim();
  const pickupManager = document.getElementById("pickupManager").value.trim();
  const dropTime      = document.getElementById("dropTime").value.trim();
  const dropManager   = document.getElementById("dropManager").value.trim();
  const equipment     = document.getElementById("equipment").value.trim();
  const memo          = document.getElementById("memo").value.trim();

  const pickPhone = contactMap[pickupManager] || "";
  const dropPhone = contactMap[dropManager]   || "";

  let text = `[상차]\n`;
  text += `상차 : ${pickupData.name || "(미입력)"}\n`;
  text += `일시 : ${pickupTime || "(조율가능)"}\n`;
  text += `장비명 : ${equipment || "(미입력)"}\n`;
  text += `주소 : ${pickupData.address || "(미입력)"}\n`;
  text += `담당자 : ${pickupManager || "(미입력)"}`;
  if (pickPhone) text += `\n연락처 : ${pickPhone}`;

  text += `\n\n[하차]\n`;
  text += `하차 : ${dropData.name || "(미입력)"}\n`;
  text += `일시 : ${dropTime || "(조율가능)"}\n`;
  text += `장비명 : ${equipment || "(미입력)"}\n`;
  text += `주소 : ${dropData.address || "(미입력)"}\n`;
  text += `담당자 : ${dropManager || "(미입력)"}`;
  if (dropPhone) text += `\n연락처 : ${dropPhone}`;

  if (memo) text += `\n\n[비고]\n${memo}`;

  document.getElementById("result").value = text;
}

// ─── 복사 ─────────────────────────────────────────────────
function copyText() {
  const ta = document.getElementById("result");
  if (!ta.value) return;

  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "✓ 복사됨";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "📋 복사";
      btn.classList.remove("copied");
    }, 2000);
  }).catch(() => {
    ta.select();
    document.execCommand("copy");
  });
}

// ─── 초기화 ───────────────────────────────────────────────
setupSearch("pickup", "pickupDropdown", "pickupMapWrap", "pickupMap",
  pickupData, "pickupAddress", "pickupContactHint");

setupSearch("drop", "dropDropdown", "dropMapWrap", "dropMap",
  dropData, "dropAddress", "dropContactHint");

// manager hint for pickup
document.getElementById("pickupManager").addEventListener("input", function() {
  const phone = contactMap[this.value.trim()];
  document.getElementById("pickupContactHint").textContent = phone ? `📞 ${phone}` : "";
});

document.getElementById("dropManager").addEventListener("input", function() {
  const phone = contactMap[this.value.trim()];
  document.getElementById("dropContactHint").textContent = phone ? `📞 ${phone}` : "";
});
</script>

</body>
</html>
