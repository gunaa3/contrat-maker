<html lang="ko">
<head>

<style>
  :root {

    --accent: #e94560;
    --accent2: #0f3460;

    --surface2: #f7f8fc;
    --border: #e2e5ef;
    --text: #1a1a2e;

    --shadow: 0 2px 16px rgba(26,26,46,0.08);

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #eef1f8;
    min-height: 100vh;
    padding: 32px 16px;
    color: var(--text);
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .header-icon {
    width: 44px;
    height: 44px;
    background: var(--primary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.5px;
  }

  .header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* \ub450 \ud328\ub110 \ub808\uc774\uc544\uc6c3 */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 600px) {
    .panels { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .badge-up   { background: #fff3cd; color: #b45309; }
  .badge-down { background: #d1fae5; color: #065f46; }

  .card-header span.label {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
  }

  /* \ud3fc \uc694\uc18c */
  .field {
    margin-bottom: 12px;
    position: relative;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 5px;
  }

  .field input, .field select {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface2);
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }

  .field input:focus, .field select:focus {
    border-color: var(--accent);
    background: #fff;
  }

  .field input.selected {
    border-color: var(--success);
    background: #f0fdf4;
  }

  /* \uac80\uc0c9 \uacb0\uacfc \ub4dc\ub86d\ub2e4\uc6b4 */
  .dropdown {
    position: absolute;
    top: calc(100% + 2px);
    left: 0; right: 0;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(26,26,46,0.12);
    z-index: 100;
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }

  .dropdown.open { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.15s;
  }

  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: #f5f7ff; }

  .dropdown-item .place-name {
    font-weight: 600;
    color: var(--primary);
  }

  .dropdown-item .place-addr {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* \uc9c0\ub3c4 */
  .map-wrap {
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
    border: 1.5px solid var(--border);
    display: none;
  }

  .map-wrap.show { display: block; }
  .map-wrap div { border-radius: 10px; }

  /* \uc7a5\ube44 + \uba54\ubaa8 \uce74\ub4dc */
  .extra-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 600px) {
    .extra-card { grid-template-columns: 1fr; }
  }

  /* \uacb0\uacfc \uce74\ub4dc */
  .result-card {
    background: var(--primary);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .result-card h3 {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  .result-card textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    font-family: 'Noto Sans KR', monospace;
    color: #e8eaf6;
    line-height: 1.8;
    resize: none;
    outline: none;
    min-height: 240px;
  }

  /* \ubc84\ud2bc */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 12px;
  }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: #d63651; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-copy {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 13px;
  }

  .btn-copy:hover { background: rgba(255,255,255,0.18); }

  .btn-copy.copied {

    color: #fff;
  }

  /* \uc5f0\ub77d\ucc98 \ubc43\uc9c0 */
  .contact-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    padding-left: 2px;
  }

  /* \uc2a4\ud06c\ub864\ubc14 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0d5e8; border-radius: 4px; }
</style>
</head>
