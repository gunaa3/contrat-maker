<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재고 관리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa;
      --surface: #fff;
      --surface2: #f0f2f8;
      --border: #e4e7f0;
      --border-strong: #c8cde0;
      --accent: #4361ee;
      --accent-dim: #3451d1;
      --accent-soft: #eef0fd;
      --text: #1a1d2e;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --success: #059669;
      --success-bg: #ecfdf5;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      /* 엑셀 색상 그대로 */
      --excel-header-bg: #1F4E78;
      --excel-col-bg: #F2F2F2;
      --excel-sum-bg: #FCE4D6;
      --excel-stock-bg: #E2EFDA;
      --font: 'Inter','Apple SD Gothic Neo',system-ui,sans-serif;
      --mono: 'JetBrains Mono','Courier New',monospace;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
    }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── Header ── */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; height:56px;
      background:var(--surface); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .logo { font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
    .logo-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
    .nav { display:flex; gap:2px; align-items:center; }
    .nav-btn {
      padding:6px 13px; border-radius:7px; border:none; background:none;
      color:var(--text-muted); font-size:13px; font-family:var(--font);
      font-weight:500; cursor:pointer; transition:all .15s;
    }
    .nav-btn:hover { background:var(--surface2); color:var(--text); }
    .nav-btn.active { background:var(--accent-soft); color:var(--accent); }
    .btn-export {
      padding:6px 13px; border-radius:7px; font-size:12px; font-family:var(--font);
      font-weight:600; cursor:pointer; transition:all .15s;
      background:var(--success-bg); color:var(--success);
      border:1px solid #a7f3d0; margin-left:10px;
    }
    .btn-export:hover { background:#d1fae5; }

    /* ── Main ── */
    .main { padding:24px 28px; max-width:1300px; margin:0 auto; }
    .panel { display:none; } .panel.active { display:block; }

    /* ── 엑셀 스타일 테이블 ── */
    .excel-wrap { overflow-x:auto; margin-bottom:20px; border-radius:var(--radius); box-shadow:var(--shadow-md); }
    .excel-table { border-collapse:collapse; font-size:12px; font-family:var(--font); min-width:100%; }
    .excel-table td, .excel-table th { border:1px solid #bfbfbf; padding:0; white-space:nowrap; }

    /* 그룹 헤더 행 (4행) */
    .row-group th {
      background:var(--excel-header-bg); color:#fff;
      font-weight:700; font-size:11px;
      text-align:center; padding:6px 10px;
      vertical-align:middle;
    }
    /* 컬럼명 행 (5행) */
    .row-col th {
      background:var(--excel-col-bg); color:var(--text);
      font-weight:700; font-size:11px;
      text-align:center; padding:6px 8px;
      vertical-align:middle; line-height:1.3;
    }
    /* 데이터 행 */
    .row-data td { padding:5px 8px; vertical-align:middle; font-size:12px; }
    .row-data td.center { text-align:center; }
    .row-data td.right { text-align:right; }
    .row-data td.sum { background:var(--excel-sum-bg); font-weight:700; text-align:right; }
    .row-data td.stock { background:var(--excel-stock-bg); font-weight:700; text-align:right; }
    .row-data td.lot-id { font-family:var(--mono); font-size:11px; text-align:center; }
    .row-data td.empty { color:#aaa; text-align:center; }
    .row-data:hover td { background-color:rgba(67,97,238,.04) !important; }

    /* ── 입고 시트 테이블 ── */
    .inbound-table { border-collapse:collapse; font-size:12px; min-width:100%; }
    .inbound-table th { background:#fff; font-weight:700; font-size:11px; text-align:center; padding:6px 8px; border:1px solid #bfbfbf; }
    .inbound-table td { padding:5px 8px; border:1px solid #bfbfbf; font-size:12px; vertical-align:middle; }
    .inbound-table tr:hover td { background:#fafbff; }

    /* ── 폼 ── */
    .card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); margin-bottom:16px;
      overflow:hidden; box-shadow:var(--shadow);
    }
    .card-header {
      padding:13px 18px; border-bottom:1px solid var(--border);
      font-size:11px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.07em;
      display:flex; justify-content:space-between; align-items:center;
    }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px; }
    .form-full { grid-column:1/-1; }
    .form-group label { display:block; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; font-weight:600; }
    input,select { width:100%; padding:8px 11px; background:var(--surface); border:1px solid var(--border-strong); border-radius:7px; color:var(--text); font-size:13px; font-family:var(--font); transition:border-color .15s,box-shadow .15s; }
    input:focus,select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(67,97,238,.1); }
    .form-actions { padding:0 18px 18px; }
    .btn { padding:8px 16px; border-radius:7px; font-size:13px; font-family:var(--font); cursor:pointer; font-weight:500; transition:all .15s; border:none; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:var(--accent-dim); }
    .btn-ghost { background:var(--surface); color:var(--text-muted); border:1px solid var(--border-strong); }
    .btn-ghost:hover { color:var(--text); background:var(--surface2); }

    /* ── 필터 ── */
    .filter-bar { display:flex; gap:10px; margin-bottom:14px; align-items:flex-end; flex-wrap:wrap; }
    .filter-bar > div { display:flex; flex-direction:column; gap:4px; }
    .filter-bar select,.filter-bar input { width:auto; min-width:120px; }
    .filter-bar label { font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }

    /* ── 섹션 제목 ── */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-title { font-size:14px; font-weight:700; letter-spacing:-.01em; }
    .section-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:22px; right:22px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:12px 16px; font-size:13px; font-weight:500;
      z-index:999; display:none; gap:8px; align-items:center; box-shadow:var(--shadow-md);
    }
    .toast.show { display:flex; }
    .toast.success { border-left:3px solid var(--success); color:var(--success); }
    .toast.error { border-left:3px solid var(--danger); color:var(--danger); }
    .loading,.empty { text-align:center; padding:40px; color:var(--text-light); font-size:13px; }

    /* ── 메트릭 카드 ── */
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .metric { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
    .metric-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; font-weight:500; }
    .metric-value { font-size:26px; font-weight:700; letter-spacing:-.02em; }
    .metric-value.accent { color:var(--accent); }
    .metric-value.success { color:var(--success); }

    /* ── 재고현황 테이블 ── */
    .dash-table { width:100%; border-collapse:collapse; font-size:13px; }
    .dash-table th { text-align:left; padding:10px 14px; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--border); font-weight:600; background:var(--surface2); }
    .dash-table td { padding:11px 14px; border-bottom:1px solid var(--border); }
    .dash-table tr:last-child td { border-bottom:none; }
    .dash-table tr:hover td { background:#fafbff; }
    .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; }
    .badge-ok { background:var(--success-bg); color:var(--success); }
    .badge-low { background:var(--warning-bg); color:var(--warning); }
    .badge-out { background:var(--danger-bg); color:var(--danger); }
    @media(max-width:700px){ .metrics{grid-template-columns:1fr 1fr;} }

    /* ── 모달 ── */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:none; align-items:center; justify-content:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:var(--surface); border-radius:var(--radius); padding:24px; width:540px; max-width:95vw; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .modal-title { font-size:15px; font-weight:700; margin-bottom:18px; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
    .btn-danger { background:var(--danger-bg); color:var(--danger); border:1px solid #fecaca; }
    .btn-danger:hover { background:#fecaca; }

    @media(max-width:700px){
      .header{padding:0 14px;} .main{padding:14px;}
      .form-grid{grid-template-columns:1fr;} .filter-bar{flex-direction:column;}
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo"><div class="logo-dot"></div>재고 관리</div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showPanel('inbound',this)">입고 등록</button>
    <button class="nav-btn" onclick="showPanel('inbound-history',this)">입고 이력</button>
    <button class="nav-btn" onclick="showPanel('outbound',this)">출고 등록</button>
    <button class="nav-btn" onclick="showPanel('history',this)">출고 이력</button>
    <button class="nav-btn" onclick="showPanel('dashboard',this)">재고 현황</button>
    <button class="nav-btn" onclick="showPanel('excelview',this)">엑셀 뷰</button>
    <button class="nav-btn" onclick="showPanel('grade',this)">Grade 관리</button>

  </nav>
</header>

<main class="main">

  <!-- ── 재고 현황 (카드 스타일) ── -->
  <div id="panel-dashboard" class="panel">
    <div class="metrics">
      <div class="metric"><div class="metric-label">총 Lot 수</div><div class="metric-value accent" id="m-lots">—</div></div>
      <div class="metric"><div class="metric-label">총 입고</div><div class="metric-value" id="m-total-in">—</div></div>
      <div class="metric"><div class="metric-label">총 출고</div><div class="metric-value" id="m-total-out">—</div></div>
      <div class="metric"><div class="metric-label">현재 재고</div><div class="metric-value success" id="m-stock">—</div></div>
    </div>
    <div class="card">
      <div class="card-header">Lot별 재고 현황</div>
      <div id="lot-table-wrap"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="card">
      <div class="card-header">업체별 출고 현황</div>
      <div id="vendor-table-wrap"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- ── 엑셀 뷰 ── -->
  <div id="panel-excelview" class="panel">
    <div class="section-header">
      <div>
        <div class="section-title">출고 현황 (엑셀 뷰)</div>
        <div class="section-sub">Lot별 입출고 및 일자별 출고 상세</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="excel-vendor-filter" onchange="loadExcelView()" style="min-width:140px;padding:6px 10px;border-radius:7px;border:1px solid var(--border-strong);font-size:13px;background:var(--surface)">
          <option value="">전체 업체</option>
        </select>
        <button class="btn-export" onclick="exportAll()">↓ 엑셀 다운로드</button>
      </div>
    </div>
    <div class="excel-wrap">
      <div id="dashboard-table"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="section-header" style="margin-top:8px">
      <div>
        <div class="section-title">수입 입고 현황</div>
        <div class="section-sub">입고 이력 전체</div>
      </div>
    </div>
    <div class="excel-wrap">
      <div id="inbound-table"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- ── Grade 관리 ── -->
  <div id="panel-grade" class="panel">
    <div class="section-header"><div class="section-title">Grade 관리</div></div>
    <div class="card">
      <div class="card-header">새 Grade 등록</div>
      <div class="form-grid">
        <div class="form-group"><label>Grade / Status</label><input type="text" id="g-name" placeholder="예: DVSTS029"></div>
        <div class="form-group"><label>KG / 단위 (드럼/Pail 등)</label><input type="number" id="g-kg" placeholder="예: 289" step="0.01"></div>
        <div class="form-group form-full"><label>비고</label><input type="text" id="g-note" placeholder="메모 (선택)"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" onclick="submitGrade()">Grade 등록</button></div>
    </div>
    <div class="card">
      <div class="card-header">등록된 Grade 목록</div>
      <div id="grade-table-wrap"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- ── 입고 이력 ── -->
  <div id="panel-inbound-history" class="panel">
    <div class="section-header"><div class="section-title">입고 이력</div></div>
    <div class="filter-bar">
      <div><label>Lot 번호</label><select id="ih-lot" onchange="loadInboundHistory()"><option value="">전체</option></select></div>
      <div><label>Grade</label><select id="ih-grade" onchange="loadInboundHistory()"><option value="">전체</option></select></div>
      <div><label>시작일</label><input type="date" id="ih-from" onchange="loadInboundHistory()"></div>
      <div><label>종료일</label><input type="date" id="ih-to" onchange="loadInboundHistory()"></div>
      <button class="btn btn-ghost" onclick="clearInboundFilters()">초기화</button>
    </div>
    <div class="card">
      <div id="inbound-history-wrap"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- ── 입고 등록 ── -->
  <div id="panel-inbound" class="panel active">
    <div class="section-header"><div class="section-title">입고 등록</div></div>
    <div class="card">
      <div class="card-header">입고 정보</div>
      <div class="form-grid">
        <div class="form-group"><label>Lot 번호 (Batch No.)</label><input type="text" id="in-lot" placeholder="예: BP9A0920A0"></div>
        <div class="form-group"><label>수입일자</label><input type="date" id="in-date"></div>
        <div class="form-group"><label>생산일자</label><input type="date" id="in-prod-date"></div>
        <div class="form-group"><label>수입 수량 (EA)</label><input type="number" id="in-qty" placeholder="0" min="0"></div>
        <div class="form-group"><label>생산 수량</label><input type="number" id="in-prod-qty" placeholder="0" min="0"></div>
        <div class="form-group"><label>Grade / Status</label>
          <input type="text" id="in-grade" placeholder="예: DVSTS029" list="grade-list" autocomplete="off" oninput="updateKg()">
          <datalist id="grade-list"></datalist>
        </div>
        <div class="form-group"><label>KG / 단위 <span id="kg-unit-label" style="color:var(--accent);font-weight:600"></span></label>
          <input type="number" id="in-kg-unit" placeholder="자동입력 (직접 수정 가능)" step="0.01">
        </div>
        <div class="form-group"><label>총 KG <span id="kg-total-label" style="color:var(--text-muted);font-size:11px">(수량 × KG/단위)</span></label>
          <input type="number" id="in-kg-total" placeholder="자동계산" step="0.01" readonly style="background:var(--surface2);color:var(--text-muted)">
        </div>
        <div class="form-group"><label>Packaging</label><select id="in-pack"><option value="">선택</option><option>Pail</option><option>Drum</option><option>Box</option><option>기타</option></select></div>
        <div class="form-group"><label>운송 방법</label><select id="in-ship"><option value="">선택</option><option>해상</option><option>항공</option></select></div>
        <div class="form-group"><label>창고</label><input type="text" id="in-warehouse" placeholder="예: 용인"></div>
        <div class="form-group"><label>Customer</label><input type="text" id="in-customer" placeholder="업체명"></div>
        <div class="form-group form-full"><label>비고</label><input type="text" id="in-note" placeholder="메모 (선택)"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" onclick="submitInbound()">입고 등록</button></div>
    </div>
  </div>

  <!-- ── 출고 등록 ── -->
  <div id="panel-outbound" class="panel">
    <div class="section-header"><div class="section-title">출고 등록</div></div>
    <div class="card">
      <div class="card-header">출고 정보</div>
      <div class="form-grid">
        <div class="form-group"><label>출고일자</label><input type="date" id="out-date"></div>
        <div class="form-group"><label>업체명</label><select id="out-vendor"><option value="">선택</option></select></div>
        <div class="form-group"><label>업체명 직접 입력 (신규)</label><input type="text" id="out-vendor-new" placeholder="기존 선택 시 비워두세요"></div>
        <div class="form-group"><label>Lot 번호</label><select id="out-lot"><option value="">선택</option></select></div>
        <div class="form-group"><label>출고 수량 (EA)</label><input type="number" id="out-qty" placeholder="0" min="1"></div>
        <div class="form-group form-full"><label>비고</label><input type="text" id="out-note" placeholder="메모 (선택)"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" onclick="submitOutbound()">출고 등록</button></div>
    </div>
  </div>

  <!-- ── 출고 이력 ── -->
  <div id="panel-history" class="panel">
    <div class="section-header"><div class="section-title">출고 이력</div></div>
    <div class="filter-bar">
      <div><label>업체</label><select id="f-vendor" onchange="loadHistory()"><option value="">전체</option></select></div>
      <div><label>Lot</label><select id="f-lot" onchange="loadHistory()"><option value="">전체</option></select></div>
      <div><label>시작일</label><input type="date" id="f-from" onchange="loadHistory()"></div>
      <div><label>종료일</label><input type="date" id="f-to" onchange="loadHistory()"></div>
      <button class="btn btn-ghost" onclick="clearFilters()">초기화</button>
    </div>
    <div class="excel-wrap">
      <div id="history-table"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<!-- ── 입고 수정 모달 ── -->
<div class="modal-overlay" id="modal-inbound">
  <div class="modal">
    <div class="modal-title">입고 수정</div>
    <div class="form-grid">
      <div class="form-group"><label>Lot 번호</label><input type="text" id="edit-in-lot"></div>
      <div class="form-group"><label>수입일자</label><input type="date" id="edit-in-date"></div>
      <div class="form-group"><label>생산일자</label><input type="date" id="edit-in-prod-date"></div>
      <div class="form-group"><label>수입 수량 (EA)</label><input type="number" id="edit-in-qty"></div>
      <div class="form-group"><label>생산 수량</label><input type="number" id="edit-in-prod-qty"></div>
      <div class="form-group"><label>Grade / Status</label><input type="text" id="edit-in-grade" list="grade-list"></div>
      <div class="form-group"><label>KG / 단위</label><input type="number" id="edit-in-kg-unit" step="0.01"></div>

        <td>${lot.비고}</td></tr>`;
    });
    for(let i=0;i<Math.max(0,10-lotList.length);i++){
      html+=`<tr class="row-data"><td class="empty">-</td><td class="empty">-</td><td class="empty">-</td><td class="right">0</td><td class="right">0</td><td class="sum">0</td><td class="stock">0</td>${rawDates.length?rawDates.map(()=>`<td class="right">0</td>`).join(''):'<td class="right">0</td>'}<td></td></tr>`;

  async function loadInboundHistory() {

    document.getElementById('inbound-history-wrap').innerHTML = `<table class="inbound-table">
      <thead><tr>
        <th>수입일자</th><th>Lot 번호</th><th>Grade</th><th>수입 수량</th>
        <th>총 KG</th><th>Packaging</th><th>운송</th><th>창고</th><th>Customer</th><th>비고</th><th></th>
      </tr></thead>
      <tbody>${data.map(r=>`<tr>
        <td>${r.날짜||''}</td>
        <td style="font-family:var(--mono);font-size:11px;color:var(--accent)">${r.lot번호||''}</td>
        <td>${r.grade||''}</td>
        <td style="text-align:right">${r.수입수량||0}</td>
        <td style="text-align:right">${r.kg_total?r.kg_total.toLocaleString():''}</td>
        <td>${r.packaging||''}</td>
        <td>${r.운송||''}</td>
        <td>${r.창고||''}</td>
        <td>${r.customer||''}</td>
        <td>${r.비고||''}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost" style="padding:3px 10px;font-size:11px;margin-right:4px" onclick='openEditInbound(${JSON.stringify(r)})'>수정</button>
          <button class="btn btn-danger" style="padding:3px 10px;font-size:11px" onclick="deleteInbound(${r.id})">삭제</button>
        </td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  function goToInboundHistory(lot) {
    // 입고 이력 탭으로 이동하고 해당 lot 필터 적용
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('panel-inbound-history').classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b=>{ if(b.textContent.trim()==='입고 이력') b.classList.add('active'); });
    loadInboundHistoryFilters().then(()=>{
      document.getElementById('ih-lot').value = lot;
      loadInboundHistory();
    });
  }

  function clearInboundFilters() {
    ['ih-lot','ih-grade','ih-from','ih-to'].forEach(id=>document.getElementById(id).value='');
    loadInboundHistory();
  }

  // ── 수정/삭제 함수 ─────────────────────────────────────────
  let _editId = null;

  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  // 입고 수정
  function openEditInbound(r) {
    _editId = r.id;
    document.getElementById('edit-in-lot').value = r.lot번호||'';
    document.getElementById('edit-in-date').value = r.날짜||'';
    document.getElementById('edit-in-prod-date').value = r.생산일자||'';
    document.getElementById('edit-in-qty').value = r.수입수량||0;
    document.getElementById('edit-in-prod-qty').value = r.생산수량||0;
    document.getElementById('edit-in-grade').value = r.grade||'';
    document.getElementById('edit-in-kg-unit').value = r.kg_per_unit||'';
    document.getElementById('edit-in-kg-total').value = r.kg_total||'';
    document.getElementById('edit-in-pack').value = r.packaging||'';
    document.getElementById('edit-in-ship').value = r.운송||'';
    document.getElementById('edit-in-warehouse').value = r.창고||'';
    document.getElementById('edit-in-customer').value = r.customer||'';
    document.getElementById('edit-in-note').value = r.비고||'';
    document.getElementById('modal-inbound').classList.add('show');
  }

  async function saveInbound() {
    const {error} = await db.from('입고').update({
      lot번호: document.getElementById('edit-in-lot').value,
      날짜: document.getElementById('edit-in-date').value,
      생산일자: document.getElementById('edit-in-prod-date').value||null,
      수입수량: parseInt(document.getElementById('edit-in-qty').value)||0,
      생산수량: parseInt(document.getElementById('edit-in-prod-qty').value)||0,
      grade: document.getElementById('edit-in-grade').value||null,
      kg_per_unit: parseFloat(document.getElementById('edit-in-kg-unit').value)||null,
      kg_total: parseFloat(document.getElementById('edit-in-kg-total').value)||null,
      packaging: document.getElementById('edit-in-pack').value||null,
      운송: document.getElementById('edit-in-ship').value||null,
      창고: document.getElementById('edit-in-warehouse').value||null,
      customer: document.getElementById('edit-in-customer').value||null,
      비고: document.getElementById('edit-in-note').value||null,
    }).eq('id', _editId);
    if(error) return toast('오류: '+error.message,'error');
    toast('수정 완료!');
    closeModal('modal-inbound');
    loadExcelView();
    loadDashboard();
    if(document.getElementById('panel-inbound-history').classList.contains('active')) loadInboundHistory();
  }

  async function deleteInbound(id) {
    if(!confirm('이 입고 기록을 삭제할까요?')) return;
    const {error} = await db.from('입고').delete().eq('id', id);
    if(error) return toast('오류: '+error.message,'error');
    toast('삭제 완료!');
    loadExcelView();
    loadDashboard();
    if(document.getElementById('panel-inbound-history').classList.contains('active')) loadInboundHistory();
  }

  // 출고 수정
  function openEditOutbound(r) {
    _editId = r.id;
    document.getElementById('edit-out-date').value = r.날짜||'';
    document.getElementById('edit-out-vendor').value = r.업체||'';
    document.getElementById('edit-out-lot').value = r.lot번호||'';
    document.getElementById('edit-out-qty').value = r.수량||0;
    document.getElementById('edit-out-note').value = r.비고||'';
    document.getElementById('modal-outbound').classList.add('show');
  }

  async function saveOutbound() {
    const {error} = await db.from('출고').update({
      날짜: document.getElementById('edit-out-date').value,
      업체: document.getElementById('edit-out-vendor').value,
      lot번호: document.getElementById('edit-out-lot').value,
      수량: parseInt(document.getElementById('edit-out-qty').value)||0,
      비고: document.getElementById('edit-out-note').value||null,
    }).eq('id', _editId);
    if(error) return toast('오류: '+error.message,'error');
    toast('수정 완료!');
    closeModal('modal-outbound');
    loadHistory();
    loadDashboard();
  }

  async function deleteOutbound(id) {
    if(!confirm('이 출고 기록을 삭제할까요?')) return;
    const {error} = await db.from('출고').delete().eq('id', id);
    if(error) return toast('오류: '+error.message,'error');
    toast('삭제 완료!');
    loadHistory();
    loadDashboard();
  }

  // 모달 오버레이 클릭 시 닫기
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if(e.target===el) el.classList.remove('show'); });
  });

  // ── 엑셀 Export (원본 100% 동일) ───────────────────────────
  async function exportAll() {
    toast('엑셀 생성 중...');
    const [inRes, outRes] = await Promise.all([
      db.from('입고').select('*').order('날짜'),
      db.from('출고').select('*').order('날짜')
    ]);
    const inData=inRes.data||[], outData=outRes.data||[];
    const wb=XLSX.utils.book_new();

    // 업체 필터 적용
    const selectedVendor = (document.getElementById('excel-vendor-filter')||{}).value || '';
    const filteredOutData = selectedVendor ? outData.filter(r=>r.업체===selectedVendor) : outData;

    // ── 시트1: 출고 ──
    {
      const lotMap={};
      inData.forEach(r=>{
        if(!lotMap[r.lot번호]) lotMap[r.lot번호]={lot번호:r.lot번호,생산일자:r.생산일자||'-',수입일자:r.날짜||'-',생산수량:0,수입수량:0,비고:r.비고||''};
        lotMap[r.lot번호].수입수량+=r.수입수량||0;
        lotMap[r.lot번호].생산수량+=r.생산수량||0;
      });
      const rawDates=[...new Set(filteredOutData.map(r=>r.날짜))].sort();
      const fmtDate=d=>{const[,m,day]=d.split('-');return`${m}/${day}`;};
      const outByLotDate={};
      filteredOutData.forEach(r=>{
        if(!outByLotDate[r.lot번호]) outByLotDate[r.lot번호]={};
        outByLotDate[r.lot번호][r.날짜]=(outByLotDate[r.lot번호][r.날짜]||0)+r.수량;
      });
      const lotList=Object.values(lotMap);
      const totalCols=7+rawDates.length+1;

      const wsData=[
        Array(totalCols).fill(''),
        Array(totalCols).fill(''),
        Array(totalCols).fill(''),
        ['1. LOT 기준 정보','','','2. 입고 정보 (자동반영)','','3. 재고 및 출고 지표 (자동반영)','','4. 일자별 출고 상세 기록 (우측으로 날짜 확장 가능)',...rawDates.slice(1).map(()=>''),''],
        ['Lot 번호','생산일자','수입일자','생산 수량','수입 수량','출고 합계\n(자동)','창고 보관 수량\n(현재고)',...rawDates.map(fmtDate),'비고'],
      ];

      lotList.forEach((lot,i)=>{
        const od=outByLotDate[lot.lot번호]||{};
        const rowNum=6+i;
        wsData.push([lot.lot번호,lot.생산일자,lot.수입일자,lot.생산수량,lot.수입수량,{f:`SUM(H${rowNum}:ZY${rowNum})`},{f:`E${rowNum}-F${rowNum}`},...rawDates.map(d=>od[d]||0),lot.비고]);
      });
      for(let i=0;i<Math.max(0,10-lotList.length);i++){
        const rowNum=6+lotList.length+i;
        wsData.push(['-','-','-',0,0,{f:`SUM(H${rowNum}:ZY${rowNum})`},{f:`E${rowNum}-F${rowNum}`},...rawDates.map(()=>0),0]);
      }

      const ws=XLSX.utils.aoa_to_sheet(wsData);

      // 병합
      ws['!merges']=[
        {s:{r:3,c:0},e:{r:3,c:2}},{s:{r:3,c:3},e:{r:3,c:4}},
        {s:{r:3,c:5},e:{r:3,c:6}},{s:{r:3,c:7},e:{r:3,c:7+Math.max(rawDates.length-1,0)}},
      ];

      const enc=XLSX.utils.encode_cell;
      const thin={style:'thin'};
      const allBorder={top:thin,bottom:thin,left:thin,right:thin};

      // 4행: 진한파랑 배경 흰글씨 bold center
      for(let c=0;c<totalCols;c++){
        const ref=enc({r:3,c});
        if(!ws[ref]) ws[ref]={t:'s',v:''};
        ws[ref].s={fill:{type:'pattern',pattern:'solid',fgColor:{rgb:'1F4E78'}},font:{bold:true,color:{rgb:'FFFFFF'}},alignment:{horizontal:'center',vertical:'center',wrapText:true}};
      }
      // 5행: 연회색 배경 bold center + border
      for(let c=0;c<totalCols;c++){
        const ref=enc({r:4,c});
        if(!ws[ref]) ws[ref]={t:'s',v:''};
        ws[ref].s={fill:{type:'pattern',pattern:'solid',fgColor:{rgb:'F2F2F2'}},font:{bold:true},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:allBorder};
      }
      // 데이터행
      const totalDataRows=Math.max(lotList.length,10);
      for(let r=5;r<5+totalDataRows;r++){
        // A~C: center border
        for(let c=0;c<3;c++){const ref=enc({r,c});if(!ws[ref])ws[ref]={t:'s',v:''};ws[ref].s={alignment:{horizontal:'center',vertical:'center',wrapText:true},border:allBorder};}
        // D~E: right border
        for(let c=3;c<5;c++){const ref=enc({r,c});if(!ws[ref])ws[ref]={t:'n',v:0};ws[ref].s={alignment:{horizontal:'right',vertical:'center'},border:allBorder};}
        // F: 주황배경 bold right border
        const fRef=enc({r,c:5});if(!ws[fRef])ws[fRef]={t:'n',v:0};
        ws[fRef].s={fill:{type:'pattern',pattern:'solid',fgColor:{rgb:'FCE4D6'}},font:{bold:true},alignment:{horizontal:'right',vertical:'center'},border:allBorder};
        // G: 초록배경 bold right border
        const gRef=enc({r,c:6});if(!ws[gRef])ws[gRef]={t:'n',v:0};
        ws[gRef].s={fill:{type:'pattern',pattern:'solid',fgColor:{rgb:'E2EFDA'}},font:{bold:true},alignment:{horizontal:'right',vertical:'center'},border:allBorder};
        // 날짜열: right border
        for(let c=7;c<7+rawDates.length;c++){const ref=enc({r,c});if(!ws[ref])ws[ref]={t:'n',v:0};ws[ref].s={alignment:{horizontal:'right',vertical:'center'},border:allBorder};}
        // 비고: left border
        const nRef=enc({r,c:7+rawDates.length});if(!ws[nRef])ws[nRef]={t:'s',v:''};ws[nRef].s={alignment:{horizontal:'left',vertical:'center'},border:allBorder};
      }

      // 열 너비 (원본 그대로)
      ws['!cols']=[{wch:16},{wch:13},{wch:13},{wch:12},{wch:12},{wch:15},{wch:16},...rawDates.map(()=>({wch:10})),{wch:20}];
      // 행 높이 (원본 그대로)
      ws['!rows']=[{},{hpt:25},{},{hpt:24},{hpt:28},...Array(totalDataRows).fill({hpt:20})];

      XLSX.utils.book_append_sheet(wb,ws,'출고');
    }

    // ── 시트2: 수입 입고 ──
    {
      const wsData=[['Status','Grade','Order No.','Production Date','Import Date','입고일자','Packaging','Batch No.','EA','Quantity\n(KG)','Shipment','Quilt여부','Customer','Remarks','Warehouse','Comment']];
      inData.forEach((r,i)=>{
        const rowNum=i+2;
        wsData.push(['입고',r.grade||'','',r.생산일자||'',r.날짜||'',r.날짜||'',r.packaging||'',r.lot번호||'',r.수입수량||0,{f:`25*I${rowNum}`},r.운송||'','',r.customer||'',r.비고||'',r.창고||'','']);
      });
      const ws=XLSX.utils.aoa_to_sheet(wsData);
      const thin={style:'thin'};
      const allBorder={top:thin,bottom:thin,left:thin,right:thin};
      // 헤더 bold
      for(let c=0;c<16;c++){const ref=XLSX.utils.encode_cell({r:0,c});if(ws[ref])ws[ref].s={font:{bold:true},border:allBorder};}
      ws['!cols']=[{wch:7},{wch:10},{wch:11},{wch:10},{wch:10},{wch:10},{wch:11},{wch:12},{wch:5},{wch:10},{wch:10},{wch:8},{wch:10},{wch:9},{wch:11},{wch:10}];
      XLSX.utils.book_append_sheet(wb,ws,'수입 입고');
    }

    const fname = selectedVendor ? `재고관리_${selectedVendor}_${today()}.xlsx` : `재고관리_${today()}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast('엑셀 다운로드 완료!');
  }

  // ── Grade 관련 ────────────────────────────────────────────
  let gradeMap = {}; // { 'DVSTS029': 289, ... }

  async function loadGradeData() {
    const { data } = await db.from('grade').select('*').order('grade');
    gradeMap = {};
    (data||[]).forEach(r => { gradeMap[r.grade] = r.kg_per_unit; });
    // datalist 업데이트
    const dl = document.getElementById('grade-list');
    if(dl) dl.innerHTML = Object.keys(gradeMap).map(g=>`<option value="${g}">`).join('');
    return data||[];
  }

  function updateKg() {
    const grade = document.getElementById('in-grade').value.trim();
    const qty = parseFloat(document.getElementById('in-qty').value)||0;
    const kgUnit = gradeMap[grade];
    const kgInput = document.getElementById('in-kg-unit');
    const kgTotal = document.getElementById('in-kg-total');
    const kgLabel = document.getElementById('kg-unit-label');
    if(kgUnit) {
      kgInput.value = kgUnit;
      kgLabel.textContent = `(${kgUnit} KG/단위)`;
    }
    const unit = parseFloat(kgInput.value)||0;
    if(qty && unit) kgTotal.value = (qty * unit).toFixed(2);
    else kgTotal.value = '';
  }

  // 수량 바뀔 때도 총 KG 업데이트
  document.getElementById('in-qty').addEventListener('input', updateKg);
  document.getElementById('in-kg-unit').addEventListener('input', () => {
    const qty = parseFloat(document.getElementById('in-qty').value)||0;
    const unit = parseFloat(document.getElementById('in-kg-unit').value)||0;
    const kgTotal = document.getElementById('in-kg-total');
    if(qty && unit) kgTotal.value = (qty * unit).toFixed(2);
    else kgTotal.value = '';
  });

  async function submitGrade() {
    const name = document.getElementById('g-name').value.trim();
    const kg = parseFloat(document.getElementById('g-kg').value);
    if(!name||!kg) return toast('Grade명과 KG는 필수입니다.','error');
    const {error} = await db.from('grade').upsert({grade:name, kg_per_unit:kg, 비고:document.getElementById('g-note').value||null}, {onConflict:'grade'});
    if(error) return toast('오류: '+error.message,'error');
    toast('Grade 등록 완료!');
    document.getElementById('g-name').value='';
    document.getElementById('g-kg').value='';
    document.getElementById('g-note').value='';
    loadGradeTable();
    loadGradeData();
  }

  async function loadGradeTable() {
    const data = await loadGradeData();
    if(!data.length){document.getElementById('grade-table-wrap').innerHTML='<div class="empty">등록된 Grade가 없습니다.</div>';return;}
    document.getElementById('grade-table-wrap').innerHTML=`<table class="dash-table">
      <thead><tr><th>Grade / Status</th><th>KG / 단위</th><th>비고</th><th></th></tr></thead>
      <tbody>${data.map(r=>`<tr>
        <td style="font-family:var(--mono);font-weight:600;color:var(--accent)">${r.grade}</td>
        <td><strong>${r.kg_per_unit}</strong> KG</td>
        <td>${r.비고||'—'}</td>
        <td><button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="deleteGrade(${r.id})">삭제</button></td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  async function deleteGrade(id) {
    if(!confirm('삭제할까요?')) return;
    const {error} = await db.from('grade').delete().eq('id',id);
    if(error) return toast('오류: '+error.message,'error');
    toast('삭제 완료!');
    loadGradeTable();
    loadGradeData();
  }

  // showPanel에 grade 추가
  const _origShowPanel = showPanel;

  // 초기 로드
  loadOutboundDropdowns();
  loadGradeData();
  loadDashboard();
</script>
</body>
